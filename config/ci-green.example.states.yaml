# "Make CI green": one plan per pull request, one ticket per distinct failure.
#
#   collect ──0──► triage ──► triaged            a script asks what failed;
#      │ └─75─► collect  (still running)         a cheap model classifies it and
#      │ └──3─► gate-green                       opens one ticket per cause
#      └nonzero► triage
#
#   ...each ticket triage opens then walks the same road:
#
#   analyze ──► propose ──► critique ──► judged ──0──► fix ──► verify ──0──► done
#                  ▲                        └nonzero──┘ (unsound, while budget)
#                  └────────────────────────┘          └─nonzero─► fix (retry)
#
#   ...except a failure that was never this change's, which is not fixed but
#   re-run (§FS-005-dispatch.11) — triage opens its ticket straight into
#   `restart-gate`, and analyze or critique can send one there on discovering
#   the same thing:
#
#   restart-gate ──0──► restarted     a program hits the failing gate and every
#                └─2──► needs-human   gate under it that is not green. Nothing
#                                     is committed; the change was not at fault
#
#   ...and the join `plan-join` opened waits for all of them:
#
#   land ──0──► collect        commit, push, let the gate run again — the next
#                              round starts where the first one did
#
# The plan is the super-task: its title is the pull request, and every ticket
# in it is one failure on that pull request. Tickets are peers rather than
# children on purpose — a parent may not be terminal while a child is not
# (§FS-rhei-plan-language.3.9), and `**Prior:**` cannot point from a child up
# to its parent, so a nested shape would leave the parent unable to finish.
# `**Prior:**` gives the ordering a tree would have given.
#
# Rounds come from ephor, not from here: when the gate changes, `ephor work
# sync` appends a new `collect` ticket to this same plan, and triage sees every
# earlier ticket — what failed before, what was decided, what was fixed — in
# the file it is reading. A machine that re-checked itself would loop without a
# bound and without anyone watching.

name: ci-green
version: 1.0

states:
  # ── what failed ──────────────────────────────────────────────────────────
  collect:
    description: Ask the forge what actually failed, before spending a model on it.
    program:
      command: "~/.config/ephor/ci-failures.sh"
      env:
        PROJECT: "{meta.project}"
        SOURCE: "{meta.source}"
        ITEM: "{meta.id}"
        REPO: "{meta.repo}"
        NUMBER: "{meta.number}"
        CHECKOUT: "{meta.workspace}"
        REPORT: "{output.failures.path}"
    program_timeout: 15m
    poll:
      interval: 10m
      max_attempts: 36
    outputs:
      - name: failures
        path: "runtime/ephor/{task_id}.failures.md"

  # ── which failures are these ─────────────────────────────────────────────
  triage:
    description: Classify the failures and open one ticket per distinct cause.
    # The cheapest model in the machine: this reads a log and writes headings.
    target: "claude-code[yolo]:anthropic:claude-haiku-4-5-20251001"
    agent_timeout: 20m
    inputs:
      - name: failures
        path: "runtime/ephor/{task_id}.failures.md"
    instructions: |
      {input.failures.path} lists what the gate reported. Group it by *cause*,
      not by job: one compile error fans out across every job that built the
      file, and those are one ticket, not thirty.

      Read the plan at {plan_path} first. It is this pull request's whole
      history: every failure seen before, what was decided about it, and
      whether it was fixed. For each cause you find now:

      - **Already has an open ticket** (a `**State:**` that is not `done`,
        `cancelled`, `restarted` or `gate-green`) — open nothing. It is being
        worked.
      - **Matches a ticket that finished** — the failure has come back. Open a
        ticket whose `**Prior:**` names that earlier one and whose body says
        what was tried before and why it did not hold. The analysis starts from
        there rather than from nothing.
      - **New** — open a ticket for it.

      Append each as a top-level ticket at the end of the plan file, exactly:

          ### Task <id>: <one line naming the cause>
          **State:** analyze
          **Prior:** Task {task_id_local}

          <what failed, in the forge's own words: the job, the error, the
          evidence you are going by — and, for a returning failure, what was
          tried before>

      Ids are `cause-<n>`, continuing from the highest already in the file.
      Change nothing else: never edit a `**State:**` line that is already
      there, and never touch the dossier.

      **A failure that is not this change's fault is not a cause to fix.** A
      runner died, a mirror was unreachable, a dependency shipped something
      broken, the same flake landed again — there is nothing to diagnose and
      nothing to commit, and those jobs simply need running again. Open its
      ticket in `restart-gate` instead:

          ### Task <id>: restart the jobs — <what died, and how you know>
          **State:** restart-gate
          **Prior:** Task {task_id_local}

          <the jobs, what they said, and the evidence that this is the gate's
          problem and not the change's>

      **And write the list of what to restart** to
      `runtime/ephor/<id>.jobs.md`, where `<id>` is the id you just gave that
      ticket. A program reads it and restarts exactly what it says, so the
      format is exact: one job per line, two fields separated by a space, and
      nothing else.

          <repo> <job-key>      that one job, in that repository's gate
          <repo> -              that repository's whole gate

      Blank lines and lines starting with `#` are ignored; a line that is
      anything else stops the restart and asks a person. Take the repository
      and the job key verbatim from the report — a key you improved on is a job
      that does not exist. Where the report names a repository but no key you
      can trust, write the `-` form and let the whole gate go again.

      Open **one** such ticket per round however many jobs died that way: they
      go in one list. It is a ticket rather than a note so that the round after
      this one can see the failure was already retried — which is the only
      thing separating a flake from a gate that is broken.

      Where the report lists no failing job at all, open no tickets and say so
      in your own output. An empty triage is a complete answer.

  plan-join:
    description: Open the ticket that waits for every cause, and lands the result.
    # A program, not the agent that opened the causes: the `**Prior:**` list
    # has to be complete and spelled correctly.
    program:
      command: "~/.config/ephor/plan-join.py"
      env:
        STATE: land
        PREFIX: "cause-"
    program_timeout: 2m

  triaged:
    description: The failures are classified; each cause has its own ticket.
    final: true

  # ── one cause, end to end ────────────────────────────────────────────────
  analyze:
    description: Find the cause, with evidence, before anyone proposes a fix.
    target: "claude-code[yolo]:anthropic:claude-sonnet-5"
    agent_timeout: 45m
    instructions: |
      Work out what is actually broken. Reproduce it locally if the failure
      admits it; where it does not, say what evidence you have instead.

      Do not fix anything here, and do not propose a fix. The one question is
      what is true: which change caused it, which code path, and how you know.
      A wrong answer here costs the two passes after it.

      Write to {output.analysis.path}: the cause, the evidence for it, the
      files involved, and — plainly — how sure you are.

      **If the failure is not this change's fault** — a flake, an
      infrastructure error, a broken dependency — there is nothing here to fix.
      Write, as the first line of your artifact:

          NOT-OURS: <what died, and how you know it is not this change>

      followed by the evidence, and write what to restart to
      `runtime/ephor/{task_id_local}.jobs.md` — one job per line, two fields, a
      space between them, nothing else:

          <repo> <job-key>      that one job, in that repository's gate
          <repo> -              that repository's whole gate

      A program restarts exactly what that file says, so take the repository
      and the key verbatim from what the forge reported. Without the file the
      restart stops and asks a person, which is the right outcome — restarting
      a gate on a guess is worse than not restarting it. The ticket then goes
      and re-runs those jobs rather than spending two more passes proposing a
      fix for something that was never broken.

      **If something is genuinely unclear — a product decision, a trade-off
      that is not yours, a failure whose intent you cannot read — do not
      guess.** Write, as the first line of your artifact:

          NEEDS-HUMAN: <the one question, asked so it can be answered in a
                        sentence>

      followed by what you know, what you tried, and the options as you see
      them. The ticket then waits for a person, in the plan, and nothing
      further is spent on a guess.

    outputs:
      - name: analysis
        path: "runtime/ephor/{task_id}.analysis.md"

  analyzed:
    description: Read the analysis; a question for a person stops here.
    program:
      command: "~/.config/ephor/route.sh"
      env:
        ARTIFACT: "{input.analysis.path}"
    program_timeout: 1m
    inputs:
      - name: analysis
        path: "runtime/ephor/{task_id}.analysis.md"

  propose:
    description: Propose the fix, and say what it could break.
    target: "claude-code[yolo]:anthropic:claude-sonnet-5"
    agent_timeout: 45m
    visits: 3
    inputs:
      - name: analysis
        path: "runtime/ephor/{task_id}.analysis.md"
      # There is no critique on the first pass, and the state must still be
      # enterable: optional declares it without requiring it.
      - name: critique
        optional: true
        path: "runtime/ephor/{task_id}.critique.md"
    instructions: |
      The cause is in {input.analysis.path}. Propose the fix — do not write it.

      Write to {output.proposal.path}:

      - the change, precisely enough to argue about: files, functions, what
        becomes true that was not
      - **the blast radius**: who else calls this, what else depends on the
        behaviour you are changing, which tests cover it and which do not.
        Go and look — `grep` the callers, read them.
      - what you considered and rejected, and why
      - how the fix will be verified: the command, and what it should say

      {if input.critique.exists}
      A previous proposal was rejected. The objection is in
      {input.critique.path}. Answer it or replace the proposal; do not repeat
      it unchanged.
      {endif}

      **If something is genuinely unclear — a product decision, a trade-off
      that is not yours, a failure whose intent you cannot read — do not
      guess.** Write, as the first line of your artifact:

          NEEDS-HUMAN: <the one question, asked so it can be answered in a
                        sentence>

      followed by what you know, what you tried, and the options as you see
      them. The ticket then waits for a person, in the plan, and nothing
      further is spent on a guess.

    outputs:
      - name: proposal
        path: "runtime/ephor/{task_id}.proposal.md"

  critique:
    description: Argue against the proposal, on behalf of everything it could break.
    # The most capable model in the machine, on the one question that is
    # expensive to get wrong: does this break something else.
    target: "claude-code[yolo]:anthropic:claude-opus-5"
    agent_timeout: 45m
    inputs:
      - name: analysis
        path: "runtime/ephor/{task_id}.analysis.md"
      - name: proposal
        path: "runtime/ephor/{task_id}.proposal.md"
    instructions: |
      Read {input.analysis.path} and {input.proposal.path}, then try to break
      the proposal. You are not reviewing style: you are the person who owns
      the code this will land on.

      Check the blast radius yourself rather than believing it. Find the caller
      the proposal missed. Ask what happens on the paths it does not mention —
      the other platform, the other configuration, the empty case, the
      concurrent one. Ask whether it fixes the cause or the symptom.

      Write to {output.critique.path}. Its first line is exactly one of:

          VERDICT: sound — this fixes the cause without breaking anything I can find
          VERDICT: unsound — <the one sentence that says why>

      Then the objections, worst first, each with the file and line that makes
      it real. An objection nobody can check is not an objection.

      Be willing to say sound. A loop that never approves anything costs the
      same as one that approves everything, and delivers less.

      If the analysis had it wrong and the failure was never this change's,
      say so with `NOT-OURS:` as the first line instead of a verdict — a
      proposal cannot be sound or unsound about a gate that broke itself — and
      write what to restart to `runtime/ephor/{task_id_local}.jobs.md`, one
      `<repo> <job-key>` per line (`-` as the key for a whole gate).

      **If something is genuinely unclear — a product decision, a trade-off
      that is not yours, a failure whose intent you cannot read — do not
      guess.** Write, as the first line of your artifact:

          NEEDS-HUMAN: <the one question, asked so it can be answered in a
                        sentence>

      followed by what you know, what you tried, and the options as you see
      them. The ticket then waits for a person, in the plan, and nothing
      further is spent on a guess.

    outputs:
      - name: critique
        path: "runtime/ephor/{task_id}.critique.md"

  judged:
    description: The verdict decides — a program reads it, so the decision is not a mood.
    program:
      command: "~/.config/ephor/route.sh"
      env:
        ARTIFACT: "{input.critique.path}"
    program_timeout: 1m
    visits: 3
    inputs:
      - name: critique
        path: "runtime/ephor/{task_id}.critique.md"

  fix:
    description: Implement the proposal that survived, and nothing else.
    target: "claude-code[yolo]:anthropic:claude-sonnet-5"
    agent_timeout: 60m
    inputs:
      - name: proposal
        path: "runtime/ephor/{task_id}.proposal.md"
      - name: critique
        path: "runtime/ephor/{task_id}.critique.md"
    instructions: |
      Implement {input.proposal.path} as it was approved in
      {input.critique.path} — including whatever the critique asked for. Not
      more: a fix that also tidies three other things is a fix nobody can
      review.

      Verify it the way the proposal said it would be verified, and put the
      command and its real output in your report. Commit in this checkout with
      a message that explains the cause and the fix.

      Do not push, and do not touch the forge, unless the ticket asks for it in
      so many words.

      Write to {output.report.path}: what you changed, what you ran, what it
      said, and anything you could not do.

      **If something is genuinely unclear — a product decision, a trade-off
      that is not yours, a failure whose intent you cannot read — do not
      guess.** Write, as the first line of your artifact:

          NEEDS-HUMAN: <the one question, asked so it can be answered in a
                        sentence>

      followed by what you know, what you tried, and the options as you see
      them. The ticket then waits for a person, in the plan, and nothing
      further is spent on a guess.

    outputs:
      - name: report
        path: "runtime/ephor/{task_id}.report.md"

  verify:
    description: Run the project's own check, so "fixed" is not the agent's opinion.
    program:
      command: "~/.config/ephor/verify.sh"
      env:
        CHECKOUT: "{meta.workspace}"
        FIX_REPORT: "{input.report.path}"
        REPORT: "{output.verification.path}"
    program_timeout: 2h
    visits: 2
    inputs:
      - name: report
        path: "runtime/ephor/{task_id}.report.md"
    outputs:
      - name: verification
        path: "runtime/ephor/{task_id}.verification.md"

  # ── a failure that was never this change's ───────────────────────────────
  restart-gate:
    description: Re-run the jobs that failed, and every gate left red under them.
    # A program, and deliberately not an agent: it is handed the list and it
    # runs it. The one judgement involved — "this is not the change's fault" —
    # was made and marked upstream, and which jobs it applies to came with it
    # (§FS-005-dispatch.11).
    program:
      command: "~/.config/ephor/restart-gate.sh"
      env:
        PROJECT: "{meta.project}"
        SOURCE: "{meta.source}"
        ITEM: "{meta.id}"
        REPO: "{meta.repo}"
        NUMBER: "{meta.number}"
        JOBS: "{input.jobs.path}"
        REPORT: "{output.restart.path}"
        # Re-running a job is a forge feature with no neutral CLI, so the
        # command is yours. It runs once per red repository, with
        # EPHOR_GATE_{PROJECT,REPO,NUMBER,ITEM} in its environment. Unset, the
        # ticket parks for a person rather than pretending it restarted
        # anything. The shape, for a Bitbucket gate driven through a
        # vendor CLI of your own:
        #
        #   GATE_RESTART: 'acme-cli gate review --platform bitbucket
        #                    --project ACME --repo "$EPHOR_GATE_REPO"
        #                    --pr "$EPHOR_GATE_NUMBER"'
        GATE_RESTART: ""
        # Counted across rounds out of the plan, not with `visits`: every round
        # opens a new ticket, and a per-state counter resets with it.
        MAX_RESTARTS: "2"
    inputs:
      # Named for the ticket's *local* id, because whoever decided this was not
      # the change's fault authored the ticket and therefore knows that id —
      # `{task_id}` carries a qualification prefix applied at load time, which
      # nothing may author (§AR-rhei-panta.3).
      #
      # Optional so that a ticket arriving without a list is refused by the
      # program, which can say which line was wrong and what the format is,
      # rather than by a transition check that can only decline to move.
      - name: jobs
        optional: true
        path: "runtime/ephor/{task_id_local}.jobs.md"
    program_timeout: 10m
    outputs:
      - name: restart
        path: "runtime/ephor/{task_id}.restart.md"

  restarted:
    description: The gate was re-run; whether it holds is the next round's question.
    # A successful terminal state, so it satisfies the join and `land` runs —
    # finding nothing to push, which is correct: there was nothing to fix.
    final: true

  # ── a branch that has fallen behind ──────────────────────────────────────
  # The deterministic move first, and a model only where it stopped
  # (§FS-005-dispatch.12). Give the `rebase` recipe `"state": "rebase"` in
  # status.json so its tickets start here rather than in `fix`.
  rebase:
    description: Replay every repository in the checkout onto its main branch.
    program:
      # ephor's own, so the reader's key and this state are one operation. It
      # takes each argument from a flag or from the name set here
      # (§FS-004-quick-actions.6).
      command: ["ephor", "rebase"]
      env:
        PROJECT: "{meta.project}"
        CHECKOUT: "{meta.workspace}"
        ITEM: "{meta.id}"
        REPORT: "{output.rebase.path}"
    program_timeout: 30m
    outputs:
      - name: rebase
        path: "runtime/ephor/{task_id}.rebase.md"

  resolve-conflicts:
    description: The replay stopped where two changes disagree; that is the work.
    agent: claude-code
    agent_mode: yolo
    agent_timeout: 45m
    inputs:
      - name: rebase
        path: "runtime/ephor/{task_id}.rebase.md"
    instructions: |
      A rebase stopped in a conflict. {input.rebase.path} says which repository
      and which files, and the repository is still standing in it — the working
      tree has the conflict markers, and `git status` will say what git thinks.

      Resolve each conflict as this change would have been written against the
      new base. Read both sides first: what the branch's commit was trying to
      do, and what the commit it now sits on top of did. Taking one side on
      principle — "ours", "theirs", whichever is shorter — is how a rebase
      silently reverts somebody's work.

      `git add` each file you resolve, then `git rebase --continue`, until the
      replay finishes or stops at the next conflict. Repeat until it is done.

      Where a conflict cannot be resolved from the code — the two changes want
      different behaviour and only a person can pick — leave the rebase where
      it is and write, as the first line of {output.report.path}:

          NEEDS-HUMAN: <the question, in a sentence>

      Otherwise write to {output.report.path}: which files conflicted, how each
      was resolved and why that is what the change meant, and what you ran to
      check it. Commit nothing else and do not push — the state after this one
      lands it.
    outputs:
      - name: report
        path: "runtime/ephor/{task_id}.report.md"

  verify-rebase:
    description: A replayed branch still has to build; "it rebased" is not "it works".
    program:
      command: "~/.config/ephor/verify.sh"
      env:
        CHECKOUT: "{meta.workspace}"
        FIX_REPORT: "{input.report.path}"
        REPORT: "{output.verification.path}"
    program_timeout: 2h
    visits: 2
    inputs:
      - name: report
        path: "runtime/ephor/{task_id}.report.md"
    outputs:
      - name: verification
        path: "runtime/ephor/{task_id}.verification.md"

  land-rebase:
    description: Push the replayed branch, and let the gate run on the new heads.
    # Its own landing state, because a replayed branch is the one case where
    # the push cannot fast-forward: `land` proper never forces anything.
    program:
      command: "~/.config/ephor/land.sh"
      env:
        CHECKOUT: "{meta.workspace}"
        BRANCH: "{meta.branch}"
        REPORT: "{output.landing.path}"
        FORCE_WITH_LEASE: "1"
    program_timeout: 30m
    outputs:
      - name: landing
        path: "runtime/ephor/{task_id}.landing.md"

  rebased:
    description: The branch is on top of its main branch, and pushed.
    final: true

  # ── ends ─────────────────────────────────────────────────────────────────
  needs-human:
    description: A question only a person can answer; the ticket waits here.
    # Gating: `rhei run` will not transition out of this state, whatever else
    # it is running. Other tickets in the plan carry on; this one stops until
    # somebody answers it and moves it on by hand.
    gating: true

  land:
    description: Every cause is fixed — commit, push, and let the gate run again.
    # Ready only when every ticket in its `**Prior:**` reached a successful
    # terminal state. This is the one state that touches the world.
    program:
      command: "~/.config/ephor/land.sh"
      env:
        CHECKOUT: "{meta.workspace}"
        BRANCH: "{meta.branch}"
        REPORT: "{output.landing.path}"
    program_timeout: 30m
    visits: 3
    outputs:
      - name: landing
        path: "runtime/ephor/{task_id}.landing.md"

  gate-green:
    description: Nothing failed; whatever holds this up is not a checkout's to fix.
    final: true

  done:
    description: The cause is fixed and the project's own check agrees.
    final: true

  # Named `cancelled` deliberately: a prerequisite in any other final state
  # satisfies a `**Prior:**`, and only this name does not. It is what stops the
  # join below from landing work while a cause is unresolved.
  cancelled:
    description: Out of budget, and a person should look. Blocks the join.
    final: true

transitions:
  # The first matching exit code wins, so the specific ones lead.
  - from: collect
    to: collect
    exit_code: 75
    description: The gate is still running — wait out poll.interval and ask again.
  - from: collect
    to: gate-green
    exit_code: 3
    description: Nothing failed.
  - from: collect
    to: triage
    exit_code: 0
    description: The failures are collected; classify them.
  - from: collect
    to: triage
    exit_code: nonzero
    description: The forge could not say; triage what is known anyway.
  - from: collect
    to: cancelled
    condition: pollAttempts >= pollMaxAttempts
    description: The gate never reached a verdict.

  - from: triage
    to: plan-join
    description: Every cause has its ticket; now open the one that waits for them.

  - from: plan-join
    to: triaged
    exit_code: 0
    description: The join is open and waiting.
  - from: plan-join
    to: triaged
    exit_code: 3
    description: Nothing was opened — there was nothing to wait for.
  - from: plan-join
    to: needs-human
    exit_code: nonzero
    description: The join could not be written; the plan needs a person.

  - from: analyze
    to: analyzed
    description: Read what the analysis concluded.

  - from: analyzed
    to: needs-human
    exit_code: 2
    description: The analysis asked a person something.
  - from: analyzed
    to: restart-gate
    exit_code: 3
    description: Not this change's failure — re-run the gate instead of fixing it.
  - from: analyzed
    to: propose
    exit_code: 0
    description: The cause is known; propose a fix for it.
  - from: analyzed
    to: propose
    exit_code: nonzero
    description: Nothing to object to at this stage.

  - from: propose
    to: critique
    description: Argue against it before writing it.

  - from: critique
    to: judged
    description: Read the verdict deterministically.

  - from: judged
    to: needs-human
    exit_code: 2
    description: The critique asked a person something.
  - from: judged
    to: restart-gate
    exit_code: 3
    description: The analysis had it wrong — the gate broke itself; re-run it.
  - from: judged
    to: fix
    exit_code: 0
    description: Sound — implement it.
  - from: judged
    to: propose
    exit_code: nonzero
    condition: visitCount < visits
    description: Unsound — propose again, answering the objection.
  - from: judged
    to: cancelled
    exit_code: nonzero
    description: Three proposals rejected; a person should look.

  # ── the gate's own fault ─────────────────────────────────────────────────
  - from: restart-gate
    to: needs-human
    exit_code: 2
    description: No restart command, the budget is spent, or the forge refused.
  - from: restart-gate
    to: restarted
    exit_code: 3
    description: Nothing was red any more; the gate moved on by itself.
  - from: restart-gate
    to: restarted
    exit_code: 0
    description: Re-run — the round after this one finds out whether it held.
  - from: restart-gate
    to: cancelled
    exit_code: nonzero
    description: The gate could not be read at all; a person should look.

  # ── a branch that has fallen behind ──────────────────────────────────────
  - from: rebase
    to: resolve-conflicts
    exit_code: 3
    description: The replay stopped in a conflict — the one part worth a model.
  - from: rebase
    to: land-rebase
    exit_code: 0
    description: Replayed cleanly, or already current; push it.
  - from: rebase
    to: needs-human
    exit_code: nonzero
    description: Uncommitted work, or git refused; nothing to replay onto.

  - from: resolve-conflicts
    to: verify-rebase
    description: Resolved — now find out whether it still builds.

  - from: verify-rebase
    to: needs-human
    exit_code: 2
    description: The resolution asked a person something.
  - from: verify-rebase
    to: land-rebase
    exit_code: 0
    description: The check passes on the new base; push it.
  - from: verify-rebase
    to: resolve-conflicts
    exit_code: nonzero
    condition: visitCount < visits
    description: The replay broke something — go back with the check's output.
  - from: verify-rebase
    to: cancelled
    exit_code: nonzero
    description: The check would not pass on the new base; a person should look.

  - from: land-rebase
    to: rebased
    exit_code: 0
    description: Pushed; the gate runs again on the new heads.
  - from: land-rebase
    to: needs-human
    exit_code: 2
    description: The remote moved under the lease, or the tree was dirty.
  - from: land-rebase
    to: cancelled
    exit_code: nonzero
    description: The push could not be made at all.

  - from: fix
    to: verify
    description: Let the project's own check say whether it holds.

  - from: verify
    to: needs-human
    exit_code: 2
    description: The fix asked a person something.
  - from: verify
    to: done
    exit_code: 0
    description: The check passes.
  - from: verify
    to: fix
    exit_code: nonzero
    condition: visitCount < visits
    description: The check still fails — go back with its output.
  - from: verify
    to: cancelled
    exit_code: nonzero
    description: The check would not pass; a person should look.

  # The gate runs again on what was pushed, so the round starts over: collect
  # waits it out and either finds it green or opens the next causes. Bounded by
  # `visits` on land — three rounds of pushing is enough without a person.
  - from: land
    to: collect
    exit_code: 0
    condition: visitCount < visits
    description: Pushed — wait for the gate the push started.
  - from: land
    to: needs-human
    exit_code: 2
    description: Landing asked a person something.
  - from: land
    to: cancelled
    exit_code: nonzero
    description: The push failed, or the rounds ran out.

  # Out of the gate, by hand only. A person writes the answer into the ticket
  # body — the decision stays in the plan, next to the question that prompted
  # it — and then names where the work resumes:
  #
  #     rhei transition <ticket> --from needs-human --to propose
  #
  - from: needs-human
    to: analyze
    description: The answer changes what the failure even is.
  - from: needs-human
    to: propose
    description: Answered — propose again, knowing it.
  - from: needs-human
    to: fix
    description: Answered, and the proposal stands.
  - from: needs-human
    to: restart-gate
    description: The infrastructure was fixed — try the gate once more.
  - from: needs-human
    to: cancelled
    description: Not worth doing; close it.
