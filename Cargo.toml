[package]
name = "ephor"
version = "0.1.0-dev"
edition = "2021"
description = "Project registry, AGENTS.md rendering, workspace updates, and per-project status feed"
license = "MIT"
repository = "https://github.com/vjovanov/ephor"
homepage = "https://github.com/vjovanov/ephor"
# §FS-001-forge-interface.5 / §FS-002-release.4: a published artifact carries no
# one person's registry or feed configuration, and none of the inherited
# documentation set. `scripts/check-no-site-specific.sh` enforces it before a
# release uploads anything; this keeps it out of the tarball meanwhile.
exclude = ["docs/", "ai/", "tests/e2e/", "systemd/", ".github/", "scripts/", "tests/integration/golden/"]

[lib]
name = "ephor"
path = "src/lib.rs"

[[bin]]
name = "ephor"
path = "src/main.rs"

# The two test homes (`tests/e2e`, `tests/integration`) are declared by path
# because Cargo does not auto-discover tests in a subdirectory of `tests/`, and
# because a target whose path is excluded from the package is dropped rather
# than published as a dangling reference — `tests/e2e/` and
# `tests/integration/golden/` are both in `exclude` above.
[[test]]
name = "e2e_001_forge_extension"
path = "tests/e2e/cases/E2E-001-forge-extension.rs"

[[test]]
name = "e2e_002_check_verbs"
path = "tests/e2e/cases/E2E-002-check-verbs.rs"

[[test]]
name = "e2e_003_gate_verbs"
path = "tests/e2e/cases/E2E-003-gate-verbs.rs"

[[test]]
name = "e2e_004_ticket_store"
path = "tests/e2e/cases/E2E-004-ticket-store.rs"

[[test]]
name = "e2e_005_dispatch"
path = "tests/e2e/cases/E2E-005-dispatch.rs"

[[test]]
name = "e2e_006_offers"
path = "tests/e2e/cases/E2E-006-offers.rs"

[[test]]
name = "e2e_012_command_line_parity"
path = "tests/e2e/cases/E2E-012-command-line-parity.rs"

[[test]]
name = "e2e_008_operations"
path = "tests/e2e/cases/E2E-008-operations.rs"

[[test]]
