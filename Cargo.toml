[package]
name = "ephor"
version = "0.1.0"
edition = "2021"
description = "Project registry, AGENTS.md rendering, workspace updates, and per-project status feed"
license = "MIT"
repository = "https://github.com/vjovanov/ephor"
homepage = "https://github.com/vjovanov/ephor"
# §FS-001-forge-interface.5 / §FS-002-release.4: a published artifact carries no
# one person's registry or feed configuration, and none of the inherited
# documentation set. `scripts/check-no-site-specific.sh` enforces it before a
# release uploads anything; this keeps it out of the tarball meanwhile.
exclude = ["docs/", "ai/", "e2e/", "systemd/", ".github/", "scripts/", "tests/golden/"]

[lib]
name = "ephor"
path = "src/lib.rs"

[[bin]]
name = "ephor"
path = "src/main.rs"

# The end-to-end scenarios (§E2E, `e2e/cases`). They are declared by path
# because a scenario lives with its grund declaration in the kind home rather
# than in `tests/`; cargo drops a target whose path is excluded from the
# package, so the published crate carries neither the cases nor a dangling
# reference to them.
[[test]]
name = "e2e_001_forge_extension"
path = "e2e/cases/E2E-001-forge-extension.rs"

[[test]]
name = "e2e_002_check_verbs"
path = "e2e/cases/E2E-002-check-verbs.rs"

[[test]]
name = "e2e_003_gate_verbs"
path = "e2e/cases/E2E-003-gate-verbs.rs"

[[test]]
name = "e2e_004_ticket_store"
path = "e2e/cases/E2E-004-ticket-store.rs"

[[test]]
name = "e2e_005_dispatch"
path = "e2e/cases/E2E-005-dispatch.rs"

[[test]]
name = "e2e_006_offers"
path = "e2e/cases/E2E-006-offers.rs"

[[test]]
name = "e2e_012_command_line_parity"
path = "e2e/cases/E2E-012-command-line-parity.rs"

[[test]]
name = "e2e_008_operations"
path = "e2e/cases/E2E-008-operations.rs"

[[test]]
name = "e2e_007_rebase_onto_the_published_copy"
path = "e2e/cases/E2E-007-rebase-onto-the-published-copy.rs"

[[test]]
name = "e2e_009_jobs"
path = "e2e/cases/E2E-009-jobs.rs"

[[test]]
name = "e2e_010_restart"
path = "e2e/cases/E2E-010-restart.rs"

[[test]]
name = "e2e_011_workflows"
path = "e2e/cases/E2E-011-workflows.rs"

[[test]]
name = "e2e_013_what_is_going"
path = "e2e/cases/E2E-013-what-is-going.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
jsonschema = { version = "0.26", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
wait-timeout = "0.2"
ratatui = "0.29"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"

[profile.release]
strip = true
# Distributed release binaries are additionally profile-guided-optimized via
# `scripts/pgo-build.sh` (§FS-002-release.3). PGO is a multi-phase
# generate/run/rebuild pipeline that needs a profile absent on a fresh clone, so
# it cannot live here or in the dev loop; a plain `cargo build --release` (and
# `cargo install ephor`) is LTO-only and behaviour-identical.
lto = true
codegen-units = 1
