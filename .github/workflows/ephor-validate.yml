# A shipped step, whole: checkout, a pinned ephor, and the published schemas
# held against what this repository carries (§FS-009-shipped-actions.1).
#
# Call it from your own workflow:
#
#     jobs:
#       ephor:
#         uses: vjovanov/ephor/.github/workflows/ephor-validate.yml@v0.1.0
#         with:
#           version: "0.1.0"
name: ephor validate

on:
  workflow_call:
    inputs:
      version:
        description: The ephor release to run, pinned by you.
        required: true
        type: string
      manifest:
        description: The `ephor.json` to check, or the root it sits at.
        required: false
        type: string
        default: "."
      registry:
        description: A committed registry to hold to the schema; empty skips it.
        required: false
        type: string
        default: ""
      runs-on:
        description: The runner to use.
        required: false
        type: string
        default: ubuntu-latest

jobs:
  validate:
    name: validate
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v6

      # A relative `uses:` inside a reusable workflow resolves against the
      # *caller's* checkout, not against the repository this file lives in — so
      # the steps have to be fetched, and `uses:` takes no expressions to
      # fetch them with. Checking ephor out at the version the caller pinned is
      # what makes the actions and the workflow version together
      # (§FS-009-shipped-actions.2). It lands beside the caller's tree rather
      # than in it, and after their own checkout, which cleans the workspace.
      - uses: actions/checkout@v6
        with:
          repository: vjovanov/ephor
          ref: v${{ inputs.version }}
          path: .ephor-steps

      - uses: ./.ephor-steps/.github/actions/setup
        with:
          version: ${{ inputs.version }}

      - uses: ./.ephor-steps/.github/actions/validate
        with:
          manifest: ${{ inputs.manifest }}
          registry: ${{ inputs.registry }}
