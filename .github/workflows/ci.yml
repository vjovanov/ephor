name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Treat rustc warnings as errors for the binary itself. NOTE: this does not
  # deny clippy lints — clippy is intentionally not part of CI here. Add a
  # `cargo clippy --no-deps -- -D warnings` step if/when we want lint enforcement.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every matrix leg even if one fails so we can see Linux + macOS +
      # Windows results together rather than aborting after the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      # Pinned to a tagged release rather than @master so a compromise of the
      # action repo doesn't silently change CI behavior on unrelated PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # §FS-002-release.1: every pull request is represented in ## Unreleased.
      - name: changelog PR entry
        if: github.event_name == 'pull_request'
        run: python scripts/check_changelog_pr_entry.py --pr-number "${{ github.event.pull_request.number }}"

      - name: python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: cargo build
        run: cargo build --all-targets --locked

      # The version the binary reports and the version in Cargo.toml are the
      # same number; the release workflow refuses to run when the tag disagrees
      # with the manifest, so a drifting `--version` would be found only there.
      - name: version self-check
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          reported="$(cargo run --locked --quiet -- --version)"
          if [ "$reported" != "ephor $manifest" ]; then
            echo "error: ephor --version says '$reported', expected 'ephor $manifest'" >&2
            exit 1
          fi
          echo "$reported"

      - name: cargo test
        run: cargo test --all-targets --locked

      # §REQ-001-boundary.5: a product name only in its own adapter, and a core
      # layer that reaches nothing above it. Alongside the site-word check the
      # release gate runs, and for the same reason: a boundary observed as a
      # convention is a boundary that has already moved.
      - name: boundary check
        run: python scripts/check_boundary.py

  # ephor is a project ephor watches, so it consumes what it ships
  # (§FS-009-shipped-actions): its own `ephor.json` is validated against the
  # published schema, and its own style verb runs through the shipped check
  # step. The binary is this checkout's rather than a release's — the steps
  # take `ephor:` for exactly this, and a release cannot be the thing that
  # tests the commit that makes it. The aggregate verb is deliberately not run
  # here: `just check` is what the `test` job already is, and running it twice
  # would double the gate to prove the same thing.
  shipped-steps:
    name: shipped steps (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build ephor
        run: cargo build --locked

      - uses: ./.github/actions/validate
        with:
          ephor: ./target/debug/ephor
          manifest: .

      - uses: ./.github/actions/check
        with:
          ephor: ./target/debug/ephor
          verbs: style

  # The tree is a grund tree: citations in requirements.md, docs/, and src/ must
  # resolve. One platform — it checks the repository's text, not behaviour.
  grund:
    name: grund check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-grund-0.9.0

      # Pinned, and the pin is part of the tree's meaning: the version decides
      # which `grund init` block the entrypoints may carry, so a checkout whose
      # CLAUDE.md says v7 needs a grund that speaks v7. Bumping the block
      # without bumping this is a gate that fails on the documentation rather
      # than on anything a change did.
      - name: Install grund
        run: cargo install grund --version 0.9.0 --locked

      - name: grund check
        run: grund check

      - name: grund fmt --check
        run: grund fmt --check
