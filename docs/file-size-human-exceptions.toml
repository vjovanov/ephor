fissile_exceptions_version = 2
# Hard-severity file-size exceptions (§FS-012-file-size.3), each a human's to
# add. An entry is identified by this registry and its `path`, which is why it
# carries no name of its own.
#
# `--kind` says what the reason has to establish, and an entry is refused if it
# establishes neither: **structural**, that splitting is illegal, naming the
# constraint; or **deferred**, that a boundary is missing, naming the boundary
# and the condition that retires the entry. Describing the file does not count —
# "it is long" is the finding, not the argument.
#
# All three entries below are `deferred`, and that is the state of this tree
# rather than a coincidence: these are the files this repository's first
# measurement found, and every one of them has a seam available. None is
# indivisible.
#
# Every ceiling here is quantized to the 100-line `[exceptions.bump]` step
# rather than pinned to what the file measured on the day it was written. That
# is `fissile`'s default and it is the right one twice over: a round number
# reads as a decision instead of as an accident of the calendar, and a ceiling
# equal to today's measurement turns every unrelated commit on `main` into a
# broken gate on every open branch. This was learned the direct way — the first
# push of this change pinned them exactly and CI failed on a merge with a `main`
# that had grown two of these files.
#
# They were written by the change that introduced the budget, with
# `fissile exception add --force`. `fissile` refuses `--severity hard` outside a
# terminal precisely so that a hard entry is somebody's decision; `--force` is
# how a scripted change asks for that decision rather than granting itself one,
# and the pull request that added this file is where it was made.
[[exceptions]]
path = "README.md"
match = "exact"
rules = ["entrypoints"]
kind = "deferred"
max_accepted = { value = 600, unit = "lines" }
until = "the Status feed and Work sections are cut to their tour, with the reference they duplicate left to docs/manual.md"
reason = """
README.md line 9 says it itself: "docs/manual.md is the manual; this page is the tour". Two of its sections are not a tour. `## Status feed` and `## Work: handing an item to an agent runtime` are 192 and 198 non-blank lines, 390 of this file's 525, and both are reference — provider tables, configuration keys, recipe fields — that docs/manual.md already carries in chapters 4 to 6 and chapter 8. Everything else here is 135 lines and is a tour. Missing boundary: nothing has to be built — the destination already exists and line 9 already names it. What is missing is the cut, which is an editorial change rather than a design one, and that is why this is deferred rather than structural. It is not taken in this commit because trimming the front door of the repository inside the change that first measures it would put an editorial judgment where a mechanical one is being reviewed, and the two should be reviewable apart.
"""
[[exceptions]]
path = "src/work/mod.rs"
match = "exact"
rules = ["source"]
kind = "deferred"
max_accepted = { value = 3400, unit = "lines" }
until = "the value types move to a sibling src/work/status.rs and the placement family to src/work/site.rs, leaving mod.rs as the dispatcher"
reason = """
Three things in one file with no boundary between them. First the vocabulary: Outcome, TicketStatus, Cancelled, WorkStatus, Tone, WorkLine, WorkGoing, WorkAt and Due are the types every surface reads a ticket's state through, and they are defined in the same file as the engine that produces them. Second, placement: site, site_for, mint, opening, pin, root_template and states_yaml decide and prepare the checkout a ticket lands in, a job with its own types and its own failure modes. Third, dispatch itself: dispatch, hand, run_hand, lay, ask, sync, cancel. A further 906 lines are the inline #[cfg(test)] mod tests, which is why the file measures 3056 while the implementation is 2150. Missing boundary: the vocabulary as a module of its own, and placement as a second. src/work/ already holds commands.rs, dossier.rs, ledger.rs, recipe.rs, workflow.rs and runtime/, so each move costs one mod line and whatever pub(crate) the moved items need.
"""
[[exceptions]]
path = "src/feed/tui/mod.rs"
match = "exact"
rules = ["source"]
kind = "deferred"
max_accepted = { value = 2000, unit = "lines" }
until = "the hand-over family moves into impl App blocks in the sibling modules that already render those screens"
reason = """
The per-screen state and rendering have already left: actions.rs, answers.rs, burn.rs, gate.rs, navigator.rs, operations.rs, prompt.rs, thread.rs and work.rs are all siblings. Two of the moves this entry was written for have since happened: the inline tests are now src/feed/tui/mod_tests.rs, and burn.rs carries its own impl App block for what its keys do — the boundary this reason names, taken for the newest screen first because it was the one being written. What is left in impl App is two families sharing &mut self. The event loop and key dispatch — event_loop, apply, submit, tick, draw — genuinely belong together and must not be broken apart. Refresh and lifecycle — load, reload_feeds, reload_work, start_refresh, collect_refresh, absorb, pulse_jobs, reload_operations — are a second. Beside them are about two dozen methods from open_work through read_log that carry out what a work or action key does, and those do not belong here: their screens already have modules, and only their behaviour is still here because those modules were written as renderers. Missing boundary: in Rust an inherent impl is a crate-wide thing rather than a module-wide one, so work.rs, actions.rs and answers.rs can each carry their own impl App block exactly as burn.rs now does, with no visibility change at all.
"""
[[exceptions]]
path = "docs/functional-spec/FS-005-dispatch.md"
match = "exact"
rules = ["specs"]
kind = "deferred"
max_accepted = { value = 2100, unit = "lines" }
until = "a section of FS-005-dispatch that carries a behaviour of its own is given a declared ID and moved to its own document"
reason = """
The split that made this file put every FS declaration in a document of its own, and dispatch is the declaration that was half the monolith: 29 sections, several of which carry whole behaviours — the roster and the seven-step hand resolution, the autorun sweep, workflows, and now provider headroom. Missing boundary: dispatch is still one declaration over many behaviours, and fissile's own message for this rule names the move — give a section that carries its own behaviour a declared ID and move it to its own file. It is not taken here because that move is a rename. §FS-005-dispatch.14 and §FS-005-dispatch.29 are cited from code, from tests, from docs/manual.md and from docs/changelog.md, and re-pointing every one of them is a change that has to be reviewed as itself rather than as a rider on the commit that first pushed the file over. The ceiling is the 100-line step above today's measurement rather than the measurement, for the reason this file's header already gives.
"""
[[exceptions]]
path = "docs/manual.md"
match = "exact"
rules = ["manual"]
kind = "deferred"
max_accepted = { value = 3400, unit = "lines" }
until = "chapter 8 becomes a document of its own, linked from the Contents"
reason = """
main brought this file to exactly its 3200-line ceiling, so any change that adds manual prose trips this rule; this one adds the chapter documenting the provider-headroom seam. Missing boundary: the manual has outgrown one document, and fissile's own message for this rule both names the destination and has already measured it — `## 8. Work` is 1251 non-blank lines, 45% of the manual on its own, and it is the reason this rule exists. The manual is deliberately one document, because scripts/manual-page.py renders it as a single standalone page, so the move is not a cut at a heading but giving that chapter a document and a link from the Contents. It is not taken here for the same reason README.md's entry above gives: cutting the largest chapter out of the manual inside a feature commit puts an editorial judgment where a feature is being reviewed, and the two should be reviewable apart.
"""
